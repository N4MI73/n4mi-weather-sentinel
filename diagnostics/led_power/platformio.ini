; Weather Sentinel -- LED and power diagnostic (Session 15).
; A separate, throwaway bench sketch. It does not touch the real firmware.
; Same board and pinned M5Unified/M5GFX as firmware/platformio.ini, so what
; this sketch proves carries straight over to the real build.
; Usage: see diagnostics/led_power/README.md.

[platformio]
default_envs = cores3-se

[env:cores3-se]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@0.2.22
    m5stack/M5GFX@0.2.29
