; Weather Sentinel — Phase 0: toolchain verification only.
; No application logic, no networking, no server dependency.
;
; Try the primary environment first:
;   pio run -e cores3-se
;   pio run -e cores3-se -t upload
;
; If that fails to resolve with "Unknown board ID: m5stack-cores3"
; (a documented issue on some platform-espressif32 versions), use the
; fallback environment instead:
;   pio run -e cores3-se-fallback
;   pio run -e cores3-se-fallback -t upload

[platformio]
default_envs = cores3-se

[env:cores3-se]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    bblanchon/ArduinoJson@^7.0.0

[env:cores3-se-fallback]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    bblanchon/ArduinoJson@^7.0.0
