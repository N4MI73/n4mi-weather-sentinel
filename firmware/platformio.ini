; Weather Sentinel -- firmware build configuration (M5Stack CoreS3 SE).
; Build/upload commands and hardware notes: see firmware/README.md.
;
; cores3-se (default) is the environment in use. cores3-se-fallback is a
; generic ESP32-S3 definition kept only in case a future espressif32
; platform release stops recognising board = m5stack-cores3; it has not
; been needed.
;
; Library versions are pinned exactly (Session 13) to the versions of the
; last hardware-confirmed build, so a library update can never change the
; device's behaviour without a deliberate edit here. To update: change a
; version, build, flash, and re-run the bench tests before committing.
;
; The platform is pinned too (2026-10-04): pioarduino 55.03.311, which is
; ESP32 Arduino core 3.3.11 / ESP-IDF 5.5.5. A plain "platform = espressif32"
; had been quietly using this same pioarduino package, already installed on
; Dan's PC for the T-Encoder Pro instruments; on another PC it would have
; fetched the official PlatformIO platform instead, which this firmware has
; never been built or tested with. The URL makes the build the same anywhere.

[platformio]
default_envs = cores3-se

[env:cores3-se]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@0.2.22
    m5stack/M5GFX@0.2.29
    bblanchon/ArduinoJson@7.4.3

[env:cores3-se-fallback]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@0.2.22
    m5stack/M5GFX@0.2.29
    bblanchon/ArduinoJson@7.4.3
